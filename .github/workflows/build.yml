name: Build Rankup3

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build plugin
        run: ./gradlew shadowJar -x compileTestJava -x test --no-daemon

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Rankup
          path: build/libs/*.jar
          if-no-files-found: error
